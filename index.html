<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Wallpapers Hub</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0d1117;
    color:white;
}

header{
    background:#161b22;
    padding:20px;
    text-align:center;
}

h1{
    color:#58a6ff;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    padding:20px;
}

.card{
    background:#161b22;
    border-radius:10px;
    overflow:hidden;
}

.card img{
    width:100%;
    display:block;
}

.card h3{
    padding:10px;
    text-align:center;
}

footer{
    text-align:center;
    padding:20px;
    background:#161b22;
}
</style>
</head>

<body>

<header>
<h1>Anime Wallpapers Hub</h1>
<p>Download HD & 4K Anime Wallpapers</p>
</header>

<section class="gallery">

<div class="card">
<img src="https://images.wallpapersden.com/image/download/naruto-4k_bW1saGuUmZqaraWkpJRmbmdlrWZlbWU.jpg" alt="Naruto">
<h3>Naruto</h3>
</div>

<div class="card">
<img src="https://images.wallpapersden.com/image/download/luffy-one-piece-4k_bGpram6UmZqaraWkpJRmbmdlrWZlbWU.jpg" alt="Luffy">
<h3>One Piece</h3>
</div>

<div class="card">
<img src="https://images.wallpapersden.com/image/download/gojo-satoru-jujutsu-kaisen-4k_bGtoam2UmZqaraWkpJRmbmdlrWZlbWU.jpg" alt="Gojo">
<h3>Jujutsu Kaisen</h3>
</div>

</section>

<footer>
<p>© 2026 Anime Wallpapers Hub</p>
</footer>

</body>
</html>
